<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Simulacros ICS · RadTechCrew</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="theme.css"></head><body class="ics-page"><header class="topbar"><div class="brand">🩻 <span>RadTechCrew</span></div><nav aria-label="Navegación principal"><a href="index.html">🏠 Inicio</a><a href="index.html#perfil">👤 Perfil</a><a href="index.html#estudio">📚 Estudio</a><a href="tests.html">🧠 Tests</a><a class="active" href="examenes-ics.html">🏥 Exámenes ICS</a></nav></header><main><section class="hero"><p class="eyebrow">OPOSICIONES · TDPI · ICS</p><h1>🏥 Simulacros tipo ICS</h1><p>6 simulacros de 60 preguntas. El banco se basa en los exámenes oficiales TDPI del ICS de 2019 y 2022 y sus contenidos, con las preguntas reformuladas para la app.</p></section><section class="panel"><div class="cards" id="simulacros-list"></div></section><section id="exam" class="panel" hidden></section></main><script src="examenes-ics.js"></script><script src="simulacros-extra.js"></script><script>(function(){const list=document.getElementById('simulacros-list');for(let n=1;n<=6;n++){const b=document.createElement('button');b.className='module-card';b.type='button';b.innerHTML='<span class="module-number">SIMULACRO '+n+'</span><h3>🏆 Simulacro ICS '+n+'</h3><p>60 preguntas · modelo '+String.fromCharCode(64+n)+' · estilo examen oficial</p><span class="module-action">Empezar →</span>';b.onclick=()=>window.startRadSim(n);list.appendChild(b)}function shuffle(a){return a.slice().sort(()=>Math.random()-0.5)}window.startRadSim=function(n){const bank=[...exams[2019].questions,...exams[2022].questions,...(window.extraICSQuestions||[])];if(bank.length<60){alert('El banco de preguntas todavía no contiene 60 preguntas.');return}let pool=shuffle(bank).slice(0,60).map(q=>{const opts=q[1].map((text,i)=>({text,i}));const mixed=shuffle(opts);return [q[0],mixed.map(x=>x.text),mixed.findIndex(x=>x.i===q[2])]}),pos=0,score=0;const box=document.getElementById('exam');box.hidden=false;function render(){if(pos>=pool.length){box.innerHTML='<div class="study-material"><p class="eyebrow">SIMULACRO '+n+' TERMINADO</p><h2>🏆 Resultado</h2><p class="final-score">'+score+' / 60</p><p>Has completado las 60 preguntas. Las preguntas proceden del banco reformulado basado en los exámenes y contenidos oficiales de TDPI del ICS de 2019 y 2022.</p><button class="secondary-button" id="again">Repetir simulacro</button> <a class="module-action exam-home" href="examenes-ics.html">Volver a simulacros</a></div>';document.getElementById('again').onclick=()=>window.startRadSim(n);return}const q=pool[pos];box.innerHTML='<div class="study-material"><p class="eyebrow">SIMULACRO '+n+'</p><h2>Pregunta '+(pos+1)+' de 60</h2><p>'+q[0]+'</p><div class="answer-grid">'+q[1].map((a,i)=>'<button class="answer-option" data-i="'+i+'">'+String.fromCharCode(65+i)+') '+a+'</button>').join('')+'</div><p class="exam-progress">Aciertos: '+score+' · Quedan '+(60-pos-1)+'</p></div>';box.scrollIntoView({behavior:'smooth',block:'start'});box.querySelectorAll('.answer-option').forEach(btn=>btn.onclick=function(){const chosen=+this.dataset.i;box.querySelectorAll('.answer-option').forEach((x,i)=>{x.disabled=true;if(i===q[2])x.classList.add('correct');if(i===chosen&&chosen!==q[2])x.classList.add('wrong')});if(chosen===q[2])score++;setTimeout(()=>{pos++;render()},550)})}render()}})();</script></body></html>
