name: Fix Module 5 topic cards

on:
  push:
    paths:
      - '.github/workflows/fix-topic39.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate topic-card injectors
        shell: python
        run: |
          from pathlib import Path
          import re

          for name, n in [('topic38.js', 38), ('topic39.js', 39)]:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              pattern = rf'\nfunction addTopic{n}Card\(\).*?\nif \(document\.readyState === .loading.\) \{{\n  document\.addEventListener\(.DOMContentLoaded, addTopic{n}Card.\);\n\}} else \{{\n  addTopic{n}Card\(\);\n\}}\n?'
              fixed, count = re.subn(pattern, '\n', s, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Expected one duplicate-card block in {name}, found {count}')
              p.write_text(fixed, encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add topic38.js topic39.js
          git diff --cached --quiet || git commit -m 'Fix Module 5 topic card rendering'
          git push
